  <style>
    @font-face { font-family: "Inter"; src: url("/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: 0.15px;
      -webkit-font-smoothing: antialiased;
      background: #FAF7FF;
    }
    main {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; overflow: hidden;
      background:
        radial-gradient(1200px 600px at 10% -10%, #ECDFFF 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 110%, #FDE4B9 0%, transparent 55%),
        #FAF7FF;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .45; pointer-events: none; }
    .blob-1 { width: 320px; height: 320px; background: #8435E9; top: -120px; right: -80px; }
    .blob-2 { width: 260px; height: 260px; background: #FDC15E; bottom: -100px; left: -60px; }
    section {
      position: relative; width: 100%; max-width: 560px; padding: 48px 40px;
      border-radius: 24px; background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border: 1px solid rgba(132, 53, 233, 0.12);
      box-shadow: 0 24px 60px -20px rgba(37, 23, 95, 0.25), 0 2px 6px rgba(37, 23, 95, 0.06);
      text-align: center;
    }
    svg { max-width: 100%; height: auto; }
    h1 { margin: 32px 0 0; font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; color: #181D27; }
    p { margin: 0; }
    .lead { margin-top: 12px; font-size: 16px; line-height: 1.6; color: #535862; }
    .more { margin-top: 24px; padding-top: 24px; border-top: 1px solid #E9EAEB; }
    .more p { font-size: 15px; line-height: 1.6; color: #535862; }
    .more .thanks { margin-top: 16px; font-weight: 600; line-height: 1.5; color: #252B37; }
    @media (max-width: 599.95px) { section { padding: 36px 24px; border-radius: 20px; } }
  </style>
</head>
